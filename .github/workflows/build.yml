name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal app
        run: make zip VERSION=${{ steps.v.outputs.version }}

      - name: Check binary
        run: lipo -info "build/Snow on Desktop.app/Contents/MacOS/SnowOnDesktop"

      - uses: actions/upload-artifact@v4
        with:
          name: SnowOnDesktop-macOS
          path: build/SnowOnDesktop-*-macOS.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/SnowOnDesktop-*-macOS.zip
          generate_release_notes: true

  demo-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Build demo
        run: make demo
